<html lang="ar" dir="rtl">
  <head>

    <title>زلازل يوم أمس</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
    <style>
      /**
       * @license
       * Copyright 2019 Google LLC. All Rights Reserved.
       * SPDX-License-Identifier: Apache-2.0
       */
      /* 
       * Always set the map height explicitly to define the size of the div element
       * that contains the map. 
       */
      #map {
        height: 100%;
      }

      /** 
       * Optional: Makes the sample page fill the window. 
       */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }

      h3 {
        margin-bottom: 0.5rem;
        font-size: 1rem;
      }

      .info-window-content {
        padding: 8px;
        font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        text-align: right;
        direction: rtl;
      }

      .info-window-content a {
        display: inline-block;
        margin-top: 8px;
        color: #1a73e8;
        text-decoration: none;
      }

      .info-window-content a:hover {
        text-decoration: underline;
      }

      /* تنسيق بسيط لتحسين عرض النوافذ المنبثقة بالعربية */
      .gm-style .gm-style-iw-c {
        max-width: 280px !important;
      }
      .title {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 100; /* أعلى من الخريطة */
        background-color: transparent; /* خلفية شفافة */
        backdrop-filter: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        direction: rtl;
        text-align: right;
      }

    </style>
  </head>
  <body>


    <div class="title">
      <p><a href="../">الصفحة الأولى</a></p>
    </div>


    <div id="map"></div>
    <script>
      /**
       * @license
       * Copyright 2019 Google LLC. All Rights Reserved.
       * SPDX-License-Identifier: Apache-2.0
       */
      
      // تعريف المتغيرات العامة
      let map;
      let infoWindow;

      function initMap() {
        // إنشاء الخريطة بمركز مناسب للعالم
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 20, lng: -160 },
          zoom: 2,
          // إضافة دعم الاتجاه من اليمين لليسار للتحكم
          rtl: true,
        });

        infoWindow = new google.maps.InfoWindow({
          content: "",
        });

        // جلب بيانات الزلازل (بصيغة JSONP)
        // هذا المصدر من هيئة المسح الجيولوجي الأمريكية (USGS)
        const script = document.createElement("script");
        script.setAttribute(
          "src",
          "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojsonp"
        );
        document.getElementsByTagName("head")[0].appendChild(script);
      }

      // دالة المعالجة المستدعاة من ملف JSONP
      function eqfeed_callback(results) {
        // التأكد من وجود نتائج
        if (!results || !results.features) return;

        for (let i = 0; i < results.features.length; i++) {
          const coords = results.features[i].geometry.coordinates;
          // الإحداثيات: خط الطول (lng) ثم خط العرض (lat) - حسب المعيار
          const latLng = new google.maps.LatLng(coords[1], coords[0]);
          
          // إنشاء علامة (Marker) لكل زلزال
          const marker = new google.maps.Marker({
            position: latLng,
            map: map,
            title: results.features[i].properties.place, // نص مساعد للعلامة
          });

          const properties = results.features[i].properties;

          // إضافة مستمع حدث النقر على العلامة لعرض معلومات مفصلة بالعربية
          marker.addListener("click", () => {
            // تحويل التوقيت الزمني (مللي ثانية) إلى تاريخ مفهوم
            const earthquakeDate = new Date(0);
            earthquakeDate.setUTCMilliseconds(properties.time);

            // تنسيق التاريخ والوقت بطريقة عربية واضحة
            const formattedDate = earthquakeDate.toLocaleString('ar-EG', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              timeZone: 'UTC',
              timeZoneName: 'short'
            });
            
            // بناء محتوى نافذة المعلومات باللغة العربية
            // نعرض مكان الزلزال، قوته، التاريخ، ورابط لمزيد من التفاصيل
            const magnitudeValue = properties.mag !== null && properties.mag !== undefined 
              ? properties.mag.toFixed(1) 
              : 'غير معروف';
            
            const placeName = properties.place || 'موقع غير محدد';
            
            // تصميم محتوى النافذة مع دعم كامل للغة العربية
            const contentString = `
              <div class="info-window-content" dir="rtl">
                <h2> ${escapeHtml(placeName)}</h2>
                <h3>قوة الزلزال: ${magnitudeValue} درجة</h3>
                <p>التوقيت: ${formattedDate}</p>
                <a href="${properties.url}" target="_blank" rel="noopener noreferrer">عرض التفاصيل على هيئة المسح الجيولوجي الأمريكية (USGS)</a>
              </div>
            `;

            infoWindow.setContent(contentString);
            infoWindow.open({
              anchor: marker,
              map: map,
              shouldFocus: false,
            });
          });
        }
      }
      
      // دالة بسيطة للوقاية من علامات HTML الضارة (أمان إضافي)
      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // ربط الدوال بالنافذة العمومية لتكون متاحة لـ JSONP
      window.initMap = initMap;
      window.eqfeed_callback = eqfeed_callback;
    </script>
    
    <!-- تحميل مكتبة خرائط Google مع مفتاح API المقدم -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC-2gcha9tU4XIfH8x8J3MH8E9VtM_rPAY&callback=initMap&v=weekly&language=ar&region=EG"
      defer
    ></script>
  </body>
</html>
